<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA20 Screener</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#131722;color:#d1d4dc;font-family:'Trebuchet MS',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* Header */
  #hdr{background:#1e222d;border-bottom:1px solid #2a2e39;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  #hdr h1{font-size:14px;font-weight:700;color:#d1d4dc;margin-right:4px}
  .tab-btn{background:none;border:none;color:#787b86;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
  .tab-btn:hover:not(.active){color:#d1d4dc;background:#2a2e39}
  .tab-btn.active{color:#2962ff;background:#1c2f7a30}

  /* Layout */
  #main{flex:1;overflow:hidden;display:flex;flex-direction:column}
  .pane{display:none;flex:1;flex-direction:column;overflow:hidden}
  .pane.active{display:flex}

  /* Toolbar */
  .toolbar{background:#1e222d;border-bottom:1px solid #2a2e39;padding:7px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
  .meta{font-size:11px;color:#787b86;flex:1;min-width:0}
  .btn{background:#2a2e39;border:1px solid #363c4e;color:#d1d4dc;padding:4px 11px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
  .btn:hover:not(:disabled){border-color:#787b86}
  .btn.primary{border-color:#2962ff55;color:#2962ff}
  .btn.primary:hover:not(:disabled){background:#1c2f7a30}
  .btn:disabled{opacity:0.45;cursor:not-allowed}
  .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f59e0b;animation:blink 1s ease-in-out infinite;margin-right:5px;vertical-align:middle}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* Watchlist-Add Form */
  .wl-form{background:#1e222d;border-bottom:1px solid #2a2e39;padding:7px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
  .wl-form input{background:#2a2e39;border:1px solid #363c4e;color:#d1d4dc;padding:4px 10px;border-radius:4px;font-size:12px;width:150px;outline:none}
  .wl-form input:focus{border-color:#2962ff}
  .wl-form input::placeholder{color:#555d6b}
  .wl-add-status{font-size:11px;color:#26a69a}

  /* Watchlist Pills */
  .wl-pills{display:flex;flex-wrap:wrap;gap:5px;padding:7px 14px;background:#131722;border-bottom:1px solid #2a2e39;flex-shrink:0;max-height:70px;overflow-y:auto}
  .pill{display:flex;align-items:center;gap:5px;background:#1e222d;border:1px solid #2a2e39;border-radius:4px;padding:2px 8px;font-size:11px}
  .pill-sym{color:#2962ff;font-weight:700}
  .pill-name{color:#787b86}
  .pill-rm{background:none;border:none;color:#555d6b;cursor:pointer;font-size:13px;line-height:1;padding:0 2px;margin-left:2px}
  .pill-rm:hover{color:#ef5350}
  .wl-empty{color:#555d6b;font-size:12px;padding:4px 0}

  /* Results */
  .results{flex:1;overflow-y:auto;padding:8px 14px}
  .no-data{color:#555d6b;font-size:12px;padding:16px 0}

  /* Hit item */
  .hit{background:#1e222d;border:1px solid #2a2e39;border-radius:5px;margin-bottom:5px;overflow:hidden}
  .hit-hdr{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;user-select:none}
  .hit-hdr:hover{background:#232733}
  .hit-sym{font-size:12px;font-weight:700;color:#2962ff;min-width:85px;flex-shrink:0}
  .hit-name{font-size:12px;color:#d1d4dc;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .hit-idx{font-size:10px;color:#787b86;padding:2px 6px;background:#2a2e39;border-radius:3px;white-space:nowrap;flex-shrink:0}
  .hit-badge{font-size:10px;padding:2px 7px;border-radius:3px;white-space:nowrap;flex-shrink:0}
  .bl{background:#26a69a1a;color:#26a69a;border:1px solid #26a69a33}
  .bs{background:#ef53501a;color:#ef5350;border:1px solid #ef535033}
  .bc{background:#2a2e39;color:#787b86;border:1px solid #363c4e}
  .wl-btn{background:none;border:1px solid #363c4e;color:#787b86;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:10px;flex-shrink:0;white-space:nowrap}
  .wl-btn:hover{border-color:#2962ff;color:#2962ff}
  .wl-btn.inWL{color:#26a69a;border-color:#26a69a44}
  .hit-arr{color:#787b86;font-size:10px;margin-left:2px;flex-shrink:0;transition:transform .15s}
  .hit.open .hit-arr{transform:rotate(180deg)}

  /* Trade table */
  .hit-body{display:none;border-top:1px solid #2a2e39}
  .hit.open .hit-body{display:block}
  .trade-tbl{width:100%;border-collapse:collapse;font-size:11px}
  .trade-tbl th{background:#131722;color:#787b86;padding:5px 11px;text-align:left;font-weight:600;white-space:nowrap}
  .trade-tbl td{padding:5px 11px;border-top:1px solid #1a1d26;white-space:nowrap}
  .trade-tbl tr.is-open td{background:#26a69a06}
  .long{color:#26a69a;font-weight:600}
  .short{color:#ef5350;font-weight:600}
  .pos{color:#26a69a}
  .neg{color:#ef5350}
  .open-tag{font-size:9px;background:#26a69a22;color:#26a69a;padding:1px 4px;border-radius:2px;margin-left:4px;vertical-align:middle}
</style>
</head>
<body>

<div id="hdr">
  <h1>MA20 Screener</h1>
  <button class="tab-btn active" onclick="switchTab('stoxx')">STOXX 600</button>
  <button class="tab-btn" onclick="switchTab('wl')">Watchlist</button>
</div>

<div id="main">

  <!-- STOXX 600 -->
  <div class="pane active" id="pane-stoxx">
    <div class="toolbar">
      <span class="meta" id="stoxx-meta">–</span>
      <button class="btn" id="btn-test" onclick="runScan('stoxx',true)">Test (20)</button>
      <button class="btn primary" id="btn-stoxx" onclick="runScan('stoxx',false)">▶ Scan starten</button>
    </div>
    <div class="results" id="res-stoxx"><div class="no-data">Noch kein Scan gelaufen.</div></div>
  </div>

  <!-- Watchlist -->
  <div class="pane" id="pane-wl">
    <div class="wl-form">
      <input id="wl-input" type="text" placeholder="Ticker, z.B. ADS.DE"
             onkeydown="if(event.key==='Enter')addTicker()">
      <button class="btn primary" onclick="addTicker()">+ Hinzufügen</button>
      <span class="wl-add-status" id="wl-status"></span>
    </div>
    <div class="wl-pills" id="wl-pills"><span class="wl-empty">Watchlist leer</span></div>
    <div class="toolbar">
      <span class="meta" id="wl-meta">–</span>
      <button class="btn primary" id="btn-wl" onclick="runScan('wl',false)">▶ Scan starten</button>
    </div>
    <div class="results" id="res-wl"><div class="no-data">Noch kein Scan gelaufen.</div></div>
  </div>

</div>

<script>
"use strict";

let watchlist = [];
let pollTimer = null;

// ── Tabs ─────────────────────────────────────────────────
function switchTab(tab) {
  ['stoxx','wl'].forEach(t => {
    document.getElementById('pane-' + t).classList.toggle('active', t === tab);
  });
  document.querySelectorAll('.tab-btn').forEach((b, i) =>
    b.classList.toggle('active', ['stoxx','wl'][i] === tab)
  );
}

// ── Scan ─────────────────────────────────────────────────
async function runScan(which, testMode) {
  const url = which === 'stoxx'
    ? `/api/stoxx/run${testMode ? '?test=1' : ''}`
    : '/api/watchlist/run';
  const btnId = which === 'stoxx' ? 'btn-stoxx' : 'btn-wl';
  document.getElementById(btnId).disabled = true;
  if (which === 'stoxx') document.getElementById('btn-test').disabled = true;
  await fetch(url, { method: 'POST' });
  setRunningUI(which, true);
  startPoll(which);
}

function setRunningUI(which, running) {
  const metaId = which === 'stoxx' ? 'stoxx-meta' : 'wl-meta';
  const btnId  = which === 'stoxx' ? 'btn-stoxx' : 'btn-wl';
  document.getElementById(btnId).disabled = running;
  if (which === 'stoxx') document.getElementById('btn-test').disabled = running;
  if (running)
    document.getElementById(metaId).innerHTML = '<span class="pulse"></span>Scan läuft …';
}

function startPoll(which) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const url = which === 'stoxx' ? '/api/stoxx/status' : '/api/watchlist/status';
    const { running } = await fetch(url).then(r => r.json());
    if (!running) {
      clearInterval(pollTimer);
      pollTimer = null;
      loadResults(which);
      document.getElementById(which === 'stoxx' ? 'btn-stoxx' : 'btn-wl').disabled = false;
      if (which === 'stoxx') document.getElementById('btn-test').disabled = false;
    }
  }, 2000);
}

// ── Load Results ─────────────────────────────────────────
async function loadResults(which) {
  const url    = which === 'stoxx' ? '/api/stoxx' : '/api/watchlist/results';
  const metaId = which === 'stoxx' ? 'stoxx-meta' : 'wl-meta';
  const resId  = which === 'stoxx' ? 'res-stoxx'  : 'res-wl';
  const data   = await fetch(url).then(r => r.json());
  const hits   = data.results || [];

  const date     = data.updatedAt ? new Date(data.updatedAt).toLocaleString('de-DE') : null;
  const schedule = which === 'stoxx' ? ' · Di + Fr 20:00' : ' · manuell';
  document.getElementById(metaId).textContent = date
    ? `Letzter Scan: ${date}${schedule} · ${data.found} Treffer von ${data.total}`
    : `Noch kein Scan${schedule}`;

  renderHits(resId, hits, which);
}

// ── Render ────────────────────────────────────────────────
function renderHits(containerId, hits, which) {
  const wrap = document.getElementById(containerId);
  if (!hits.length) { wrap.innerHTML = '<div class="no-data">Keine Treffer.</div>'; return; }
  wrap.innerHTML = hits.map(h => hitHTML(h, which)).join('');
}

function hitHTML(h, which) {
  const last   = h.trades[h.trades.length - 1];
  const isOpen = last?.open;
  const dir    = last?.direction;
  const bCls   = isOpen ? (dir === 'Long' ? 'bl' : 'bs') : 'bc';
  const entryDate = last?.entryDate || '–';
  const bTxt   = isOpen ? `${dir} offen · ${entryDate}` : `geschlossen · ${entryDate}`;
  const sid    = safeId(h.symbol);
  const inWL   = watchlist.some(s => s.symbol === h.symbol);

  const addBtn = which === 'stoxx'
    ? `<button class="wl-btn${inWL ? ' inWL' : ''}" id="wlb-${sid}"
         onclick="event.stopPropagation();addFromStoxx('${esc(h.symbol)}','${esc(h.name)}','${esc(h.index)}')"
       >${inWL ? '✓ WL' : '+ WL'}</button>`
    : `<button class="wl-btn" style="color:#ef5350;border-color:#ef535033"
         onclick="event.stopPropagation();removeTicker('${esc(h.symbol)}')"
       >✕</button>`;

  const rows = h.trades.map(tradeRow).join('');

  return `
<div class="hit" id="hit-${sid}">
  <div class="hit-hdr" onclick="toggleHit('${sid}')">
    <span class="hit-sym">${h.symbol}</span>
    <span class="hit-name">${h.name}</span>
    <span class="hit-idx">${h.index}</span>
    <span class="hit-badge ${bCls}">${bTxt}</span>
    ${addBtn}
    <span class="hit-arr">▼</span>
  </div>
  <div class="hit-body">
    <table class="trade-tbl">
      <thead><tr>
        <th>Datum Einstieg</th><th>Datum Ausstieg</th>
        <th>Long / Short</th><th>Einstiegskurs</th>
        <th>Ausstiegskurs</th><th>Differenz %</th><th>Abstand Signal</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
</div>`;
}

function tradeRow(t) {
  const exitDate  = t.exitDate  || `<span style="color:#26a69a">offen<span class="open-tag">läuft</span></span>`;
  const exitPrice = t.exitPrice != null ? num(t.exitPrice) : '–';
  const dCls = t.direction === 'Long' ? 'long' : 'short';
  const profitable = t.direction === 'Long'
    ? t.exitPrice > t.entryPrice
    : t.exitPrice < t.entryPrice;
  const pCls = profitable ? 'pos' : 'neg';
  const sign = t.diffPct >= 0 ? '+' : '';
  const dist = t.signalDist != null ? `+${t.signalDist} %` : '–';
  return `<tr class="${t.open ? 'is-open' : ''}">
    <td>${t.entryDate}</td>
    <td>${exitDate}</td>
    <td class="${dCls}">${t.direction}</td>
    <td>${num(t.entryPrice)}</td>
    <td>${exitPrice}</td>
    <td class="${pCls}">${sign}${t.diffPct} %</td>
    <td class="pos">${dist}</td>
  </tr>`;
}

function num(n) {
  return typeof n === 'number'
    ? n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 4 })
    : n;
}

function toggleHit(id) {
  document.getElementById('hit-' + id).classList.toggle('open');
}

function safeId(sym) { return sym.replace(/[^a-zA-Z0-9]/g, '-'); }
function esc(s)      { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// ── Watchlist ─────────────────────────────────────────────
async function loadWatchlist() {
  watchlist = await fetch('/api/watchlist').then(r => r.json());
  renderPills();
}

function renderPills() {
  const wrap = document.getElementById('wl-pills');
  if (!watchlist.length) {
    wrap.innerHTML = '<span class="wl-empty">Watchlist leer</span>';
    return;
  }
  wrap.innerHTML = watchlist.map(s =>
    `<div class="pill">
      <span class="pill-sym">${s.symbol}</span>
      <span class="pill-name">${s.name}</span>
      <button class="pill-rm" onclick="removeTicker('${esc(s.symbol)}')" title="Entfernen">×</button>
    </div>`
  ).join('');
}

async function addTicker() {
  const inp = document.getElementById('wl-input');
  const sym = inp.value.trim().toUpperCase();
  if (!sym) return;
  const st = document.getElementById('wl-status');
  st.textContent = '…';
  const r = await fetch('/api/watchlist/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ symbol: sym, name: sym, index: 'manuell' }),
  });
  if (r.ok) {
    inp.value = '';
    st.textContent = `${sym} hinzugefügt`;
    setTimeout(() => { st.textContent = ''; }, 2000);
    await loadWatchlist();
  } else {
    st.textContent = 'Fehler';
  }
}

async function addFromStoxx(symbol, name, index) {
  await fetch('/api/watchlist/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ symbol, name, index }),
  });
  await loadWatchlist();
  const btn = document.getElementById('wlb-' + safeId(symbol));
  if (btn) { btn.textContent = '✓ WL'; btn.classList.add('inWL'); }
}

async function removeTicker(symbol) {
  await fetch('/api/watchlist/' + encodeURIComponent(symbol), { method: 'DELETE' });
  await loadWatchlist();
  await Promise.all([loadResults('stoxx'), loadResults('wl')]);
}

// ── Init ─────────────────────────────────────────────────
async function init() {
  await loadWatchlist();
  const [ss, ws] = await Promise.all([
    fetch('/api/stoxx/status').then(r => r.json()),
    fetch('/api/watchlist/status').then(r => r.json()),
  ]);
  if (ss.running) { setRunningUI('stoxx', true); startPoll('stoxx'); }
  if (ws.running) { setRunningUI('wl',    true); startPoll('wl'); }
  await Promise.all([loadResults('stoxx'), loadResults('wl')]);
}

init();
</script>
</body>
</html>
