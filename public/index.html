<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>MA20 Screener</title>
<style>
  /* ── Apple-Farbschema (System Colors), hell + dunkel ── */
  :root{
    --bg:#f5f5f7; --surface:#ffffff; --fill:#e8e8ed; --fill-hover:#dedee3; --sep:#d2d2d7; --row-hover:#f5f5f7;
    --label:#1d1d1f; --label2:#6e6e73; --label3:#aeaeb2;
    --blue:#0071e3; --green:#248a3d; --red:#d70015; --orange:#c93400;
    --green-bg:#34c7591f; --red-bg:#ff3b301a; --blue-bg:#007aff1a;
    --shadow:0 1px 3px #0000000f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --surface:#1c1c1e; --fill:#2c2c2e; --fill-hover:#3a3a3c; --sep:#38383a; --row-hover:#242426;
      --label:#f5f5f7; --label2:#98989d; --label3:#636366;
      --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
      --green-bg:#30d15826; --red-bg:#ff453a26; --blue-bg:#0a84ff26;
      --shadow:none;
    }
  }

  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--label);font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  button,input{font:inherit;color:inherit}
  .wrap{max-width:1280px;margin:0 auto;padding:0 16px}

  /* Header */
  #hdr{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep)}
  #hdr .wrap{display:flex;align-items:center;gap:16px;height:48px}
  #hdr h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .seg{display:flex;background:var(--fill);border-radius:8px;padding:2px}
  .seg button{background:none;border:none;color:var(--label);padding:4px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500}
  .seg button.active{background:var(--surface);box-shadow:0 1px 3px #00000026;font-weight:600}
  @media (prefers-color-scheme: dark){ .seg button.active{background:#636366} }
  .seg .count{color:var(--label2);font-weight:400;margin-left:4px}

  .pane{display:none;padding:12px 0 32px}
  .pane.active{display:block}

  /* Toolbar */
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .meta{font-size:12px;color:var(--label2);flex:1;min-width:0}
  .btn{background:var(--fill);border:none;color:var(--label);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
  .btn:hover:not(:disabled){background:var(--fill-hover)}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--blue);filter:brightness(1.1)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);animation:blink 1s ease-in-out infinite;margin-right:6px;vertical-align:middle}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .add input{background:var(--surface);border:1px solid var(--sep);padding:4px 10px;border-radius:7px;font-size:12px;width:170px;outline:none}
  .add input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
  .add input::placeholder{color:var(--label3)}
  .add{display:flex;gap:6px;align-items:center}
  .add-status{font-size:12px;color:var(--label2)}
  .add-status.err{color:var(--red)}

  /* Tabelle */
  .card{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);overflow-x:auto}
  .no-data{color:var(--label2);font-size:13px;padding:22px 14px;text-align:center}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .list th{font-size:11px;font-weight:500;color:var(--label2);text-align:left;padding:7px 8px;border-bottom:1px solid var(--sep);white-space:nowrap}
  .list th.sortable{cursor:pointer;user-select:none}
  .list th.sortable:hover{color:var(--label)}
  .list th.sortable.active{color:var(--label)}
  .list th .sort-ind{display:inline-block;width:10px;font-size:9px;margin-left:2px;opacity:.35}
  .list th.active .sort-ind{opacity:1}
  .list td{padding:6px 8px;white-space:nowrap}
  .list tr.row{cursor:pointer}
  .list tr.row + tr.row td, .list tr.detail + tr.row td{border-top:1px solid var(--sep)}
  .list tr.row:hover td{background:var(--row-hover)}
  .list tr.row.noexp{cursor:default}
  .r{text-align:right !important}
  .c-sym{font-weight:600;color:var(--blue);width:1%}
  .c-name{max-width:210px;overflow:hidden;text-overflow:ellipsis}
  .c-idx{color:var(--label2);font-size:12px}
  .muted{color:var(--label3)}
  .pos{color:var(--green)}
  .neg{color:var(--red)}
  .chev{display:inline-block;width:10px;color:var(--label3);font-size:9px;transition:transform .15s;margin-right:4px}
  tr.row.open .chev{transform:rotate(90deg)}
  .sig{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;min-width:46px;text-align:center}
  .sig.long{background:var(--green-bg);color:var(--green)}
  .sig.short{background:var(--red-bg);color:var(--red)}
  .sig.closed{background:var(--fill);color:var(--label2);font-weight:500}

  .arr{font-size:10px;margin-right:5px}
  .arr.up{color:var(--blue)}
  .arr.down{color:var(--label)}
  .new{font-size:10px;font-weight:600;color:var(--orange);margin-left:6px;text-transform:uppercase;letter-spacing:.03em}
  .old{color:var(--label2)}

  /* Aktionen */
  .c-act{width:1%;text-align:right}
  .acts{display:inline-flex;gap:4px;align-items:center}
  .ico{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:24px;min-width:24px;padding:0 5px;background:none;border:none;border-radius:6px;color:var(--label2);cursor:pointer;font-size:11px;font-weight:500}
  .ico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ico:hover{background:var(--fill);color:var(--blue)}
  .ico.del:hover{background:var(--red-bg);color:var(--red)}
  .ico.wl{padding:0 8px;background:var(--fill);color:var(--label)}
  .ico.wl:hover{background:var(--fill-hover);color:var(--blue)}
  .ico.wl.on{background:var(--blue-bg);color:var(--blue)}
  .ico.wl.on:hover{background:var(--red-bg);color:var(--red)}

  /* Trade-Historie */
  tr.detail{display:none}
  tr.row.open + tr.detail{display:table-row}
  tr.detail > td{padding:0 10px 10px 28px;background:var(--surface)}
  .hist{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .hist h3{font-size:11px;font-weight:600;color:var(--label2);margin:2px 0 4px 2px}
  .trades{width:auto;background:var(--bg);border-radius:8px;font-size:12px}
  .trades th{font-size:11px;font-weight:500;color:var(--label2);padding:5px 12px;text-align:left;white-space:nowrap}
  .trades td{padding:4px 12px;border-top:1px solid var(--sep);white-space:nowrap}
  .dir-long{color:var(--green);font-weight:600}
  .dir-short{color:var(--red);font-weight:600}

  /* Hinweis nach Löschen */
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--label);color:var(--bg);font-size:12px;padding:8px 8px 8px 14px;border-radius:10px;display:none;align-items:center;gap:10px;box-shadow:0 4px 16px #0000004d}
  #toast.show{display:flex}
  #toast button{background:none;border:none;color:inherit;font-weight:600;cursor:pointer;padding:2px 8px;border-radius:6px;opacity:.85}
  #toast button:hover{opacity:1;text-decoration:underline}
</style>
</head>
<body>

<div id="hdr"><div class="wrap">
  <h1>MA20 Screener</h1>
  <div class="seg">
    <button class="active" data-tab="stoxx">STOXX 600<span class="count" id="cnt-stoxx"></span></button>
    <button data-tab="wl">Watchlist<span class="count" id="cnt-wl"></span></button>
  </div>
</div></div>

<div class="wrap">

  <!-- STOXX 600 -->
  <div class="pane active" id="pane-stoxx">
    <div class="toolbar">
      <div class="seg" id="flt">
        <button class="active" data-f="all">Alle<span class="count"></span></button>
        <button data-f="kauf" title="Neuer Kaufpfeil"><span class="arr up">▲</span>Kauf<span class="count"></span></button>
        <button data-f="verkauf" title="Neuer Verkaufspfeil"><span class="arr down">▼</span>Verkauf<span class="count"></span></button>
        <button data-f="ma20" title="Neues MA20-Signal">MA20<span class="count"></span></button>
      </div>
      <span class="meta" id="stoxx-meta">–</span>
      <button class="btn" id="btn-test" onclick="runScan('stoxx',true)">Test (20)</button>
      <button class="btn primary" id="btn-stoxx" onclick="runScan('stoxx',false)">Scan starten</button>
    </div>
    <div class="card" id="res-stoxx"><div class="no-data">Noch kein Scan gelaufen.</div></div>
  </div>

  <!-- Watchlist -->
  <div class="pane" id="pane-wl">
    <div class="toolbar">
      <div class="add">
        <input id="wl-input" type="text" placeholder="Ticker, z. B. ADS.DE" autocomplete="off"
               onkeydown="if(event.key==='Enter')addTicker()">
        <button class="btn" onclick="addTicker()">Hinzufügen</button>
        <span class="add-status" id="wl-status"></span>
      </div>
      <span class="meta r" id="wl-meta">–</span>
      <button class="btn primary" id="btn-wl" onclick="runScan('wl',false)">Scan starten</button>
    </div>
    <div class="card" id="res-wl"><div class="no-data">Watchlist leer.</div></div>
  </div>

</div>

<div id="toast"><span id="toast-txt"></span><button id="toast-undo">Rückgängig</button></div>

<script>
"use strict";

let watchlist = [];
const data    = { stoxx: { results: [] }, wl: { results: [] } };
const openRows = new Set();          // "stoxx|SYM" / "wl|SYM"
let pollTimer = null;
let stoxxFilter = 'all';
try { stoxxFilter = localStorage.getItem('stoxxFilter') || 'all'; } catch {}
// Sortierung per Klick auf „Pfeil seit" / „Einstieg" (1 = aufsteigend, -1 = absteigend)
let sortState = { key: 'arrow', dir: 1 };
try { const s = JSON.parse(localStorage.getItem('sortState')); if (s && ['arrow', 'entry'].includes(s.key) && [1, -1].includes(s.dir)) sortState = s; } catch {}

// Filter der STOXX-Liste: jeweils nur Titel mit NEUEM Signal dieser Art
const FILTERS = {
  all:     () => true,
  kauf:    h => h.arrows?.at(-1)?.direction === 'Kauf'    && isNew(h.arrows.at(-1).date, 'stoxx'),
  verkauf: h => h.arrows?.at(-1)?.direction === 'Verkauf' && isNew(h.arrows.at(-1).date, 'stoxx'),
  ma20:    h => isNew(h.trades?.at(-1)?.entryDate, 'stoxx'),
};

const ICON_CHART = '<svg viewBox="0 0 16 16"><path d="M2 2.5v11h12"/><path d="M4.5 10.5l3-3.5 2.5 2 3.5-4.5"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.6 8.5h6.8l.6-8.5M6.7 7v3.5M9.3 7v3.5"/></svg>';

// ── Helfer ───────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => typeof n === 'number'
  ? n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '–';
const pct = n => typeof n === 'number'
  ? (n > 0 ? '+' : '') + n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' %' : '–';
const dat = d => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(d || ''); return m ? `${m[3]}.${m[2]}.${m[1].slice(2)}` : '–'; };
const arrowHTML = a => `<span class="arr ${a.direction === 'Kauf' ? 'up' : 'down'}">${a.direction === 'Kauf' ? '▲' : '▼'}</span>${esc(a.direction)}`;
const dist = n => n != null ? num(n).replace(/,00$/, '') + ' %' : '–';
// "neu" = Signal in den letzten 5 Handelstagen (≈ 8 Kalendertage) vor dem Scan
function isNew(d, which) {
  const u = data[which].updatedAt;
  if (!d || !u) return false;
  const cut = new Date(u); cut.setDate(cut.getDate() - 8);
  return d >= cut.toISOString().slice(0, 10);
}
const dateCell = (d, which) => isNew(d, which) ? `${dat(d)}<span class="new">neu</span>` : `<span class="old">${dat(d)}</span>`;
const inWL = sym => watchlist.some(s => s.symbol === sym);

// ── Tabs ─────────────────────────────────────────────────
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('active', x === b));
  ['stoxx', 'wl'].forEach(t => $('pane-' + t).classList.toggle('active', t === b.dataset.tab));
});

$('flt').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  stoxxFilter = b.dataset.f;
  try { localStorage.setItem('stoxxFilter', stoxxFilter); } catch {}
  render('stoxx');
});

// ── Scan ─────────────────────────────────────────────────
async function runScan(which, testMode) {
  const url = which === 'stoxx' ? `/api/stoxx/run${testMode ? '?test=1' : ''}` : '/api/watchlist/run';
  setRunningUI(which, true);
  await fetch(url, { method: 'POST' });
  startPoll(which);
}

function setRunningUI(which, running) {
  $(which === 'stoxx' ? 'btn-stoxx' : 'btn-wl').disabled = running;
  if (which === 'stoxx') $('btn-test').disabled = running;
  if (running) $(which === 'stoxx' ? 'stoxx-meta' : 'wl-meta').innerHTML = '<span class="pulse"></span>Scan läuft …';
}

function startPoll(which) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const url = which === 'stoxx' ? '/api/stoxx/status' : '/api/watchlist/status';
    const { running } = await fetch(url).then(r => r.json());
    if (!running) {
      clearInterval(pollTimer);
      pollTimer = null;
      setRunningUI(which, false);
      loadResults(which);
    }
  }, 2000);
}

// ── Daten laden ──────────────────────────────────────────
async function loadResults(which) {
  const url = which === 'stoxx' ? '/api/stoxx' : '/api/watchlist/results';
  data[which] = await fetch(url).then(r => r.json());
  data[which].results = data[which].results || [];
  render(which);
}

async function loadWatchlist() {
  watchlist = await fetch('/api/watchlist').then(r => r.json());
}

// ── Darstellung ──────────────────────────────────────────
function render(which) {
  const d    = data[which];
  const date = d.updatedAt ? new Date(d.updatedAt).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) : null;
  let rows, meta;

  if (which === 'stoxx') {
    if (!FILTERS[stoxxFilter]) stoxxFilter = 'all';
    document.querySelectorAll('#flt button').forEach(b => {
      b.classList.toggle('active', b.dataset.f === stoxxFilter);
      b.querySelector('.count').textContent = d.results.filter(FILTERS[b.dataset.f]).length;
    });
    rows = d.results.filter(FILTERS[stoxxFilter]);
    meta = date ? `Letzter Scan ${date} · ${d.found} Treffer von ${d.total} · automatisch Di + Fr 20:00`
                : 'Noch kein Scan · automatisch Di + Fr 20:00';
    $('cnt-stoxx').textContent = d.results.length || '';
  } else {
    // Alle Watchlist-Titel zeigen; Scan-Ergebnis (falls vorhanden) dazumischen.
    const bySym  = new Map(d.results.map(r => [r.symbol, r]));
    const names  = new Map(data.stoxx.results.map(r => [r.symbol, r]));
    rows = watchlist.map(s => {
      const known = s.name && s.name !== s.symbol ? s : (names.get(s.symbol) || s);
      const res = bySym.get(s.symbol);
      return { symbol: s.symbol, name: known.name, index: known.index || s.index, close: res?.close,
               trades: res?.trades || [], arrows: res?.arrows || [] };
    });
    const hits = rows.filter(r => isNew(r.trades.at(-1)?.entryDate, 'wl') || isNew(r.arrows.at(-1)?.date, 'wl')).length;
    meta = date ? `Letzter Scan ${date} · ${hits} Titel mit neuem Signal von ${rows.length}`
                : `${rows.length} Titel · noch kein Scan`;
    $('cnt-wl').textContent = rows.length || '';
  }

  if (!$(which === 'stoxx' ? 'btn-stoxx' : 'btn-wl').disabled)
    $(which === 'stoxx' ? 'stoxx-meta' : 'wl-meta').textContent = meta;

  // Nach der gewählten Spalte sortieren („Pfeil seit" oder „Einstieg"), bei Gleichstand nach
  // der jeweils anderen in gleicher Richtung; fehlende Daten immer ans Ende.
  const getDate = {
    arrow: h => h.arrows?.at(-1)?.date,
    entry: h => h.trades?.at(-1)?.entryDate,
  };
  const byDate = (da, db, dir) => {
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return dir * (new Date(da) - new Date(db));
  };
  const { key, dir } = sortState;
  const other = key === 'arrow' ? 'entry' : 'arrow';
  rows = [...rows].sort((a, b) =>
    byDate(getDate[key](a), getDate[key](b), dir) || byDate(getDate[other](a), getDate[other](b), dir));
  const sortTh = (k, label, title = '') => {
    const on = sortState.key === k;
    const ind = on ? (sortState.dir === 1 ? '▲' : '▼') : '▲';
    return `<th class="sortable${on ? ' active' : ''}" data-sort="${k}"${title ? ` title="${title}"` : ''}>${label}<span class="sort-ind">${ind}</span></th>`;
  };

  const wrap = $('res-' + which);
  if (!rows.length) {
    wrap.innerHTML = `<div class="no-data">${which === 'stoxx' ? (!date ? 'Noch kein Scan gelaufen.' : d.results.length ? 'Keine Treffer für diesen Filter.' : 'Keine Treffer.') : 'Watchlist leer.'}</div>`;
    return;
  }
  wrap.innerHTML = `
<table class="list">
  <thead><tr>
    <th>Ticker</th><th>Name</th><th>Index</th>
    <th title="Kauf-/Verkaufspfeil wie im Chart (20-Tage-Ausbruch, nur das erste Signal nach einem Gegensignal)">Pfeil</th>${sortTh('arrow', 'Pfeil seit', 'Klicken zum Sortieren')}
    <th title="MA20-Signal">MA20</th>${sortTh('entry', 'Einstieg', 'Klicken zum Sortieren')}
    <th class="r">Einstiegskurs</th><th class="r">Aktuell</th><th class="r">Differenz</th>
    <th class="r" title="Abstand zum Signal">Abstand</th><th></th>
  </tr></thead>
  <tbody>${rows.map(h => rowHTML(h, which)).join('')}</tbody>
</table>`;
}

function rowHTML(h, which) {
  h.trades = h.trades || []; h.arrows = h.arrows || [];
  const last   = h.trades[h.trades.length - 1];
  const arrow  = h.arrows[h.arrows.length - 1];
  const key    = which + '|' + h.symbol;
  const hasT   = h.trades.length > 0 || h.arrows.length > 0;
  const name   = h.name && h.name !== h.symbol ? esc(h.name) : '<span class="muted">–</span>';

  let sig = '<span class="muted">–</span>';
  if (last) sig = last.open
    ? `<span class="sig ${last.direction === 'Long' ? 'long' : 'short'}">${esc(last.direction)}</span>`
    : '<span class="sig closed">geschlossen</span>';

  const on  = inWL(h.symbol);
  const act = which === 'stoxx'
    ? `<button class="ico wl${on ? ' on' : ''}" data-act="${on ? 'remove' : 'add'}"
         title="${on ? 'Aus Watchlist entfernen' : 'Zur Watchlist hinzufügen'}">${on ? '✓ Watchlist' : '+ Watchlist'}</button>`
    : `<button class="ico del" data-act="remove" title="Aus Watchlist löschen">${ICON_TRASH}</button>`;

  const arrowCells = arrow
    ? `<td>${arrowHTML(arrow)}</td><td>${dateCell(arrow.date, which)}</td>`
    : '<td class="muted">–</td><td class="muted">–</td>';
  const current = last ? last.exitPrice : h.close;
  const cells = last
    ? `<td>${dateCell(last.entryDate, which)}</td>
       <td class="r">${num(last.entryPrice)}</td>
       <td class="r">${num(current)}</td>
       <td class="r ${last.diffPct >= 0 ? 'pos' : 'neg'}">${pct(last.diffPct)}</td>
       <td class="r">${dist(last.signalDist)}</td>`
    : `<td class="muted">–</td><td class="r muted">–</td><td class="r">${num(current)}</td><td class="r muted">–</td><td class="r muted">–</td>`;

  return `
<tr class="row${hasT ? '' : ' noexp'}${hasT && openRows.has(key) ? ' open' : ''}" data-sym="${esc(h.symbol)}" data-which="${which}">
  <td class="c-sym"><span class="chev">${hasT ? '▶' : ''}</span>${esc(h.symbol)}</td>
  <td class="c-name" title="${esc(h.name)}">${name}</td>
  <td class="c-idx">${esc(h.index)}</td>
  ${arrowCells}
  <td>${sig}</td>
  ${cells}
  <td class="c-act"><span class="acts">
    <button class="ico" data-act="chart" title="Chart öffnen">${ICON_CHART}</button>
    ${act}
  </span></td>
</tr>
${hasT ? `<tr class="detail"><td colspan="12"><div class="hist">
  ${h.arrows.length ? `<div><h3>Pfeile</h3><table class="trades">
    <thead><tr><th>Datum</th><th>Pfeil</th><th class="r">Kurs</th></tr></thead>
    <tbody>${h.arrows.map(a => `<tr><td>${dat(a.date)}</td><td>${arrowHTML(a)}</td><td class="r">${num(a.price)}</td></tr>`).join('')}</tbody>
  </table></div>` : ''}
  ${h.trades.length ? `<div><h3>MA20-Trades</h3><table class="trades">
    <thead><tr><th>Einstieg</th><th>Ausstieg</th><th>Richtung</th><th class="r">Einstiegskurs</th>
      <th class="r">Ausstiegskurs</th><th class="r">Differenz</th><th class="r">Abstand Signal</th></tr></thead>
    <tbody>${h.trades.map(tradeRow).join('')}</tbody>
  </table></div>` : ''}
  </div></td></tr>` : ''}`;
}

function tradeRow(t) {
  return `<tr>
    <td>${dat(t.entryDate)}</td>
    <td>${t.exitDate ? dat(t.exitDate) : '<span class="pos">offen</span>'}</td>
    <td class="${t.direction === 'Long' ? 'dir-long' : 'dir-short'}">${esc(t.direction)}</td>
    <td class="r">${num(t.entryPrice)}</td>
    <td class="r">${num(t.exitPrice)}</td>
    <td class="r ${t.diffPct >= 0 ? 'pos' : 'neg'}">${pct(t.diffPct)}</td>
    <td class="r">${dist(t.signalDist)}</td>
  </tr>`;
}

// ── Klicks in den Tabellen ───────────────────────────────
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const k = th.dataset.sort;
    sortState = sortState.key === k ? { key: k, dir: -sortState.dir } : { key: k, dir: 1 };
    try { localStorage.setItem('sortState', JSON.stringify(sortState)); } catch {}
    ['stoxx', 'wl'].forEach(w => { try { render(w); } catch {} });
    return;
  }
  const row = e.target.closest('tr.row');
  if (!row) return;
  const sym = row.dataset.sym, which = row.dataset.which;
  const btn = e.target.closest('button[data-act]');
  if (btn) {
    if (btn.dataset.act === 'chart')  window.open('/chart.html?symbol=' + encodeURIComponent(sym), '_blank');
    if (btn.dataset.act === 'remove') removeTicker(sym);
    if (btn.dataset.act === 'add') {
      const h = data.stoxx.results.find(r => r.symbol === sym);
      postAdd({ symbol: sym, name: h?.name, index: h?.index });
    }
    return;
  }
  if (row.classList.contains('noexp')) return;
  const key = which + '|' + sym;
  openRows.has(key) ? openRows.delete(key) : openRows.add(key);
  row.classList.toggle('open');
});

// ── Watchlist ────────────────────────────────────────────
async function postAdd(entry) {
  const r = await fetch('/api/watchlist/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(entry),
  });
  if (r.ok) { await loadWatchlist(); render('stoxx'); render('wl'); }
  return r.ok;
}

async function addTicker() {
  const inp = $('wl-input'), st = $('wl-status');
  const sym = inp.value.trim().toUpperCase();
  if (!sym) return;
  st.className = 'add-status';
  if (inWL(sym)) { st.textContent = `${sym} ist bereits enthalten`; return; }
  const known = data.stoxx.results.find(r => r.symbol === sym);
  const ok = await postAdd({ symbol: sym, name: known?.name || sym, index: known?.index || 'manuell' });
  if (ok) { inp.value = ''; st.textContent = `${sym} hinzugefügt`; setTimeout(() => { st.textContent = ''; }, 2500); }
  else    { st.className = 'add-status err'; st.textContent = 'Fehler beim Hinzufügen'; }
}

let toastTimer = null;
async function removeTicker(symbol) {
  const entry = watchlist.find(s => s.symbol === symbol);
  const r = await fetch('/api/watchlist/' + encodeURIComponent(symbol), { method: 'DELETE' });
  if (!r.ok) return;
  await loadWatchlist();
  render('stoxx'); render('wl');
  if (!entry) return;
  $('toast-txt').textContent = `${symbol} aus der Watchlist gelöscht`;
  $('toast-undo').onclick = async () => { hideToast(); await postAdd(entry); };
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast() { $('toast').classList.remove('show'); }

// ── Init ─────────────────────────────────────────────────
async function init() {
  await loadWatchlist();
  const [ss, ws] = await Promise.all([
    fetch('/api/stoxx/status').then(r => r.json()),
    fetch('/api/watchlist/status').then(r => r.json()),
  ]);
  if (ss.running) { setRunningUI('stoxx', true); startPoll('stoxx'); }
  if (ws.running) { setRunningUI('wl',    true); startPoll('wl'); }
  await loadResults('stoxx');
  await loadResults('wl');
}

init();
</script>
